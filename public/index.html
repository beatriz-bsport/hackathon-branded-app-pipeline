<!DOCTYPE html>
<html>
<head>
  <title>Embeddable Widget</title>
</head>
<body style="width: 100%; height:010%"
  <div style="margin-left: 0px; display: flex; flex-direction: column; align-items: center; padding: 20px">
    <div>
      <p>Here is the widget</p>
    </div>
    
    <div id="bsport-widget-007"></div>
    
    <div>
      <p style="background: red;">Here is some text below the widget</p>
    </div>
    
    <script src="./widget.js"></script>
    <script>
      BsportWidget.mount({
          "parentElement": "bsport-widget-007",
          "companyId": 201,
          "dialogMode": 2,
          "widgetType": "loginButton", 
          "showFab": false,
          "fullScreenPopup": true,
          "config": {
              "loginButton": {
                    
              }
          }  
      })
    </script>
    
    <div style="height: 100px; width: 100px; background-color: red"/>
      <p> Some random element in the website of the studio trying to break stuff</p>
    </div>
    
    <div>
      <script src="http://localhost:9000/widget.js"></script>
      <script> 
        BsportWidget.mount({
            "parentElement": "bsport-widget-878002",
            "companyId": 201,
            "dialogMode": 2,
            "widgetType": "calendar", 
            "showFab": false,
            "fullScreenPopup": false,
            "config": {
                "calendar": {
                    "compactMode": null                   
                }
            }  
        })
      </script>
      <div id="bsport-widget-878002"/>
    </div>
  </div>
</body>
</html>
