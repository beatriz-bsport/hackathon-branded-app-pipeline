Lint:
  # Temp : Prefix with monorepo as it is still store on bsport-saas-builder registry
  image: ${REGISTRY_ENDPOINT}/${REGISTRY_NAME}:monorepo-${CI_COMMIT_REF_NAME}
  stage: lint
  interruptible: true
  tags:
    - build-frontend
    - cluster:bsport-tooling
  extends:
    - .before-script-install-node-modules
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - git fetch origin $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
    - pnpm exec nx affected --target=lint --base=origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME
