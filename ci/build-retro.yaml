.Build Deploy Retro generic:
  variables:
    CLOUDFRONT_INVALIDATION_LAMBDA_URL: 'https://uc7e26gvpwrprl5hubmfe4zeou0zyqyu.lambda-url.eu-west-3.on.aws/'
  tags:
    - build-frontend
    - cluster:bsport-tooling
  retry:
    max: 2
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $TRIGGERED_JOB == "tag-releases"'
      when: always
    - when: never

  image: ${REGISTRY_ENDPOINT}/bsport/bsport-saas-builder:${CI_COMMIT_REF_NAME}
  stage: tag-releases
  # cache:
  #   files:
  #     - yarn.lock
  #   paths:
  #       - "$YARN_CACHE_DIR"
  #       - "$CYPRESS_CACHE_FOLDER/node_modules"
  #       - node_modules
  script:
    - RETRO_IDENTIFIER="${RETRO_DURATION}${RETRO_DURATION_TYPE}"
    - mv /app/node_modules .
    - TODAY=`date +%F`
    - echo "running date -d ${TODAY} -${RETRO_DURATION} ${RETRO_DURATION_TYPE} +%F"
    - apk add coreutils # the date cmd in busybox is not enough for date manipulation
    - RETRO_TAG=release-`coreutils --coreutils-prog=date -d ${TODAY} -${RETRO_DURATION} ${RETRO_DURATION_TYPE} +%F`
    - echo "goin back to retro tag ${RETRO_TAG}"
    - git checkout $RETRO_TAG
    - yarn install --frozen-lockfile # just to be sure
    - echo "FAILED" > .job_status
    - VERSION=`echo "$(cat ./VERSION)"`
    - export ENVIRONMENT=retro-${RETRO_IDENTIFIER}
    - export S3_BUCKET="s3://bsport-backoffice-assets-retro-${RETRO_IDENTIFIER}/"
    - export FRONTEND_URL="backoffice-${RETRO_IDENTIFIER}.retro.bsport.io"
    - echo "Preparing VERSION:${VERSION} on ${ENVIRONMENT}"
    - echo "export default '`date +%F+%H+%M`';" > src/release-date.js
    - echo "export default '$VERSION';" > src/release.js
    - echo "\"$VERSION\"" > public/version.json
    - VERSION_SHA="${VERSION}-${CI_COMMIT_SHORT_SHA}"
    - echo "export default '$VERSION_SHA';" > src/release-sha.js
    - yarn updateTranslation
    - yarn build
    - sed -i "s/RETRO_IDENTIFIER/${RETRO_IDENTIFIER}/g" envs/${ENV_TEMPLATE_FILE}
    - mv envs/${ENV_TEMPLATE_FILE} build/env.js
    - export SENTRY_NO_PROGRESS_BAR=1
    - ./scripts/prepare-sentry-release.sh $VERSION_SHA $FRONTEND_URL
    - rm ./build/static/js/*.js.map
    - aws s3 cp ./build/ $S3_BUCKET --recursive --only-show-errors $ACL_PARAM
    - aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_ID --paths /index.html /service-worker.js /manifest.json
    - scripts/prepare-sentry-deploy.sh $VERSION_SHA $ENVIRONMENT
    - echo "SUCCESS" > .job_status
    - cat .job_status

Build Deploy Retro 1day:
  extends: .Build Deploy Retro generic
  variables:
    ENV_TEMPLATE_FILE: template-retro
    CLOUDFRONT_ID: E1NSUD9Y338KY7
    RETRO_DURATION: 1
    RETRO_DURATION_TYPE: day

