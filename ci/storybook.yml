.Deploy-storybook:
  image: ${REGISTRY_ENDPOINT}/bsport/bsport-saas-builder:${CI_COMMIT_REF_NAME}
  stage: static-analysis

  tags:
    - build-frontend
    - cluster:bsport-tooling
  retry:
    max: 1
  variables:
    S3_BUCKET: s3://bsport-eu-docs
    CLOUDFRONT_ID: E2TQR3C50EPHHV
    CLOUDFRONT_INVALIDATION_LAMBDA_URL: 'https://6pmc3n3l2yo5krr4v3jq6qud6i0fwkqj.lambda-url.eu-west-3.on.aws/'
  script:
    - mv /app/node_modules/ .
    - echo "env.PUBLIC_URL = 'https://docs.infra.bsport.io/storybook/${CI_COMMIT_REF_NAME}'" >> ./envs/storybook
    - echo "env.I18N_TRANSLATION_DOMAIN = 'https://docs.infra.bsport.io/storybook/${CI_COMMIT_REF_NAME}'" >> ./envs/storybook
    - cp ./envs/storybook ./envs/local
    - echo '<script>' > .storybook/preview-head.html && cat ./envs/local >> .storybook/preview-head.html && echo '</script>' >> .storybook/preview-head.html
    - yarn updateTranslation
    - yarn install --frozen-lockfile # just to be sure
    - NODE_OPTIONS=--max-old-space-size=5000 yarn build-storybook --quiet --output-dir storybook
    - aws s3 cp ./storybook/ $S3_BUCKET/storybook/$CI_COMMIT_REF_NAME --recursive --only-show-errors --acl public-read
    - aws s3 cp ./public/locales/ $S3_BUCKET/storybook/$CI_COMMIT_REF_NAME/locales --recursive --only-show-errors --acl public-read
    - scripts/invalidate-cloudfront-storybook.sh $CLOUDFRONT_ID $CLOUDFRONT_INVALIDATION_TOKEN $CLOUDFRONT_INVALIDATION_LAMBDA_URL

Deploy-storybook Feature Branch:
  extends: .Deploy-storybook
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: $CI_COMMIT_REF_NAME == "production"
      when: never
    - if: $CI_COMMIT_REF_NAME == "dev"
      when: never
    - if: $CI_COMMIT_REF_NAME == "master"
      when: never
    - when: always

Deploy-storybook:
  extends: .Deploy-storybook
  allow_failure: true
  stage: label-issues
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_REF_NAME == "dev"
      when: always
    - if: $CI_COMMIT_REF_NAME == "master"
      when: always
    - if: $CI_COMMIT_REF_NAME == "production"
      when: always
    - when: never
