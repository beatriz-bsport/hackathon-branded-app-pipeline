Analyze:
  image: ${REGISTRY_ENDPOINT}/${REGISTRY_NAME}:${CI_COMMIT_REF_SLUG}
  stage: analyze
  interruptible: true
  tags:
    - build-frontend
    - cluster:bsport-tooling
  extends:
    - .before-script-install-node-modules
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - NX_BASE=$CI_MERGE_REQUEST_TARGET_BRANCH_NAME
    - git fetch origin $NX_BASE
    - echo "*"
    - echo "⏳ Lint ichizen affected projects"
    - pnpm exec nx affected --target=lint --base=origin/$NX_BASE
    - echo "✅ All ichizen affected projects have been linted"
    - echo "*"
    - echo "⏳ Check saas-legacy format"
    - pnpm exec nx affected --target=pretty --base=origin/$NX_BASE
    - echo "✅ Saas-legacy project is well formated"
    - echo "*"
    - echo "⏳ Lint legacy affected projects"
    - pnpm exec nx affected --target=lint-old --base=origin/$NX_BASE
    - echo "✅ All legacy affected projetcs have been linted"
    - echo "*"
    - echo "⏳ Check translations files have been commited"
    - pnpm run -w translation:update
    - NB_LOCALES_DIFF=$(echo $(git diff HEAD --name-only | grep '/locales' | wc -l))
    - |
      if [ "$NB_LOCALES_DIFF" != "0" ]; then
        echo "❗ Detected changes in **/locales files that have not been commited ❗"
        exit 1
      fi
    - echo "✅ All translations have been managed as expected"
