Validate MR Title:
  image: node:22-alpine
  stage: init
  interruptible: true
  allow_failure: true
  tags:
    - light
    - cluster:bsport-tooling
  script:
    - chmod +x ./tools/scripts/validate-mr-title.sh
    - ./tools/scripts/validate-mr-title.sh "$CI_MERGE_REQUEST_TITLE"
  rules:
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "staging"
      when: "never"
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "production"
      when: "never"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
