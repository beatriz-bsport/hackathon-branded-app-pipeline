.Prepare Docker Builder Image Base:
  extends:
    - .ci-ecr-authentication
  image: 672633452901.dkr.ecr.eu-west-3.amazonaws.com/bsport-infra/gitlab-build-docker:v1.1.0
  tags:
    - build
    - cluster:bsport-tooling
  stage: prepare-image-docker
  retry: 
    max: 2
  script:
    - sleep 20 # because the docker service needs to be up'd cf https://gitlab.com/gitlab-org/charts/gitlab/-/issues/478
    - docker build --no-cache --network host --build-arg TODAY=`date +%s` --build-arg ENVIRONMENT=$ENVIRONMENT --build-arg GIT_USERNAME=$GIT_USERNAME --build-arg GIT_PASSWORD=$GIT_PASSWORD --build-arg CI_COMMIT_REF_SLUG=$CI_COMMIT_REF_SLUG -t ${REGISTRY_ENDPOINT}/bsport/bsport-widget-builder:${CI_COMMIT_REF_SLUG} .
    - docker push ${REGISTRY_ENDPOINT}/bsport/bsport-widget-builder:${CI_COMMIT_REF_SLUG}
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    DOCKER_HOST: tcp://docker:2375
  services:
    - docker:24-dind


Prepare Docker Builder Image Staging:
  extends: .Prepare Docker Builder Image Base
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: $CI_COMMIT_REF_NAME == "master"
      when: on_success
    - when: never
  variables:
    S3BUCKETNAME: bsport-eu-cdn-staging
    ENVIRONMENT: staging
    CLOUDFRONT_ID: E2NQSHB4DJBRY8
    SLACK_WEBHOOK_URL: "${SLACK_STAGING_WEBHOOK_URL}"
    CDN_DOMAIN: cdn.staging.bsport.io

Prepare Docker Builder Image Production:
  extends: .Prepare Docker Builder Image Base
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: $CI_COMMIT_REF_NAME == "production"
      when: on_success
    - when: never
  variables:
    S3BUCKETNAME: bsport-cdn
    ENVIRONMENT: production
    CLOUDFRONT_ID: E3PVSAXDFQZX1T 
    SLACK_WEBHOOK_URL: "${SLACK_PRODUCTION_WEBHOOK_URL}"
    CDN_DOMAIN: cdn.bsport.io

Prepare Docker Builder Image Dev:
  extends: .Prepare Docker Builder Image Base
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: $CI_COMMIT_REF_NAME == "dev"
      when: on_success
    - when: never
  variables:
    ENVIRONMENT: dev
    SLACK_WEBHOOK_URL: "${SLACK_DEV_WEBHOOK_URL}"
    S3BUCKETNAME: bsport-eu-cdn-dev
    CLOUDFRONT_ID: ESH8WNSF9KT1H
    CDN_DOMAIN: cdn.dev.bsport.io

Prepare Docker Builder Image Feature Branch:
  extends: .Prepare Docker Builder Image Base
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
      when: never
    - if: $CI_COMMIT_TAG =~ /deploy-/
      when: on_success
    - when: never
  script:
    - export FEATURE_BRANCH_IDENTIFIER=`echo $CI_COMMIT_TAG | sed -n 's/.*deploy-\(frontend-only-\)\{0,1\}\([[:alnum:]_-]\+\).*/\2/p'`
    - sleep 20 # because the docker service needs to be up'd cf https://gitlab.com/gitlab-org/charts/gitlab/-/issues/478
    - docker build --no-cache --network host --build-arg TODAY=`date +%s` --build-arg FEATURE_BRANCH_IDENTIFIER=$FEATURE_BRANCH_IDENTIFIER --build-arg ENVIRONMENT=$FEATURE_BRANCH_IDENTIFIER --build-arg GIT_USERNAME=$GIT_USERNAME --build-arg GIT_PASSWORD=$GIT_PASSWORD --build-arg CI_COMMIT_REF_SLUG=$FEATURE_BRANCH_IDENTIFIER -t ${REGISTRY_ENDPOINT}/bsport/bsport-widget-builder:${CI_COMMIT_REF_SLUG} .
    - docker push ${REGISTRY_ENDPOINT}/bsport/bsport-widget-builder:${CI_COMMIT_REF_SLUG}
