Deploy-storybook Feature Branch:
  extends: .Deploy-storybook
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: $CI_COMMIT_REF_NAME == "production"
      when: never
    - if: $CI_COMMIT_REF_NAME == "dev"
      when: never
    - if: $CI_COMMIT_REF_NAME == "master"
      when: never
    - if: $CI_COMMIT_TAG =~ /deploy-/
      when: never
    - when: on_success

Deploy-storybook:
  extends: .Deploy-storybook
  allow_failure: true
  stage: storybook
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: $CI_COMMIT_REF_NAME == "dev"
      when: on_success
    - if: $CI_COMMIT_REF_NAME == "master"
      when: on_success
    - if: $CI_COMMIT_REF_NAME == "production"
      when: on_success
    - if: $CI_COMMIT_TAG =~ /deploy-/
      when: never
    - when: never
