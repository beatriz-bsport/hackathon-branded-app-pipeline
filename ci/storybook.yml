.Deploy-storybook:
  image: ${REGISTRY_ENDPOINT}/bsport/bsport-saas-builder:${CI_COMMIT_REF_NAME}
  stage: static-analysis
  
  tags:
    - build
    - kubernetes
  retry: 
    max: 1
  variables:
    S3_BUCKET: s3://bsport-eu-docs
    CLOUDFRONT_ID: E2TQR3C50EPHHV
  script:
    - mv /app/node_modules/ .
    - yarn install --frozen-lockfile # just to be sure
    - yarn build-storybook --output-dir storybook
    - aws s3 cp ./storybook/ $S3_BUCKET/storybook/$CI_COMMIT_REF_NAME --recursive --only-show-errors
    - aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_ID --paths /$CI_COMMIT_REF_NAME/index.html 


Deploy-storybook Feature Branch:
  extends: .Deploy-storybook
  except:
    - dev
    - master
    - production

Deploy-storybook Feature Branch:
  extends: .Deploy-storybook
  allow_failure: true
  only:
    - dev
    - master
    - production


