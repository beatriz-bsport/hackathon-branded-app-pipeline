Lint:
  stage: lint
  image: node:22-alpine
  interruptible: true

  tags:
    - build-frontend
    - cluster:bsport-tooling

  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

  script:
    - git fetch origin $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
    - pnpm exec nx affected --target=lint --base=origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME
