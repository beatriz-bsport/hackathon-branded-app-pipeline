Lint:
  tags:
    - deployment
    - cluster:bsport-tooling
  image: ${REGISTRY_ENDPOINT}/bsport/bsport-widget-builder:${CI_COMMIT_REF_NAME}
  stage: static-analysis
  variables:
    ENVIRONMENT: dev
  script:
    - cd /bsport-saas/
    - yarn link
    - cd /app/
    - yarn link bsport-saas
    - yarn lint

  except:
    - master
    - production
