Lint and Compile:
  image: ${REGISTRY_ENDPOINT}/bsport/bsport-saas-builder:${CI_COMMIT_REF_NAME}
  stage: static-analysis
  tags:
    - high-ram
    - cluster:bsport-tooling
  script:
    - mv /app/node_modules .
    - yarn install --frozen-lockfile # just to be sure
    - echo "Format checking CSS files"
    - yarn pretty
    - echo "Type checking all files"
    - yarn compile
    - echo "Lint checking all files"
    - yarn lint

  except:
    - master
    - production

Test:
  image: ${REGISTRY_ENDPOINT}/bsport/bsport-saas-builder:${CI_COMMIT_REF_NAME}
  stage: static-analysis
  tags:
    - build
    - cluster:bsport-tooling
  script:
    - mv /app/node_modules .
    - yarn install --frozen-lockfile # just to be sure
    - yarn test

  except:
    - master
    - production
