<!DOCTYPE html>
<html>
  <head>
    <title>Embeddable Widget</title>
  </head>
  <body>
    <div style="margin-left: 0px">
      <p>
          Here is the widget
        </p>
          <div id="bsport-widget"></div>
        <p style="background: red;">
          Here is some text below the widget
        </p>
    <script src="./widget.js"></script>
    <script>
      BsportWidget.mount({
        parentElement: 'bsport-widget',
        compactMode: null,
        companyId: 89,
        widgetType: 'workshop', //calendar/workshop/pass/shop
        lang: 'fr-FR',
        filtersOpen: true,
        defaultFilters:{
          coaches:[],
          establishments:[],
          levels:[],
          metaActivities:[],
        }
      });
    </script>
    </div>
  </body>
</html>
