<!DOCTYPE html>
<html>
  <head>
    <title>Embeddable Widget</title>
  </head>
  <body>
      <p>
          Here is the widget
        </p>
          <div id="bsport-widget"></div>
        <p>
          Here is some text below the widget
        </p>
        <div id="bsport-widget-workshop"></div>

    <script src="./widget.js"></script>
    <script>
      new BsportWidget({
        parentElement: 'bsport-widget',
        companyId: 82,
        widgetType: 'calendar', //calendar/workshop/pass/shop
        lang: 'fr-FR'
      }).mount();

      new BsportWidget({
        parentElement: 'bsport-widget-workshop',
        companyId: 82,
        widgetType: 'workshop', //calendar/workshop/pass/shop
        lang: 'en-US'
      }).mount();
    </script>
  </body>
</html>
