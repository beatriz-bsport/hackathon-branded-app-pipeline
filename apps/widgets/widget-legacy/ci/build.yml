Build Deploy Staging:
  extends: .Build and deploy Base
  environment:
      name: staging
      deployment_tier: staging
      url: https://backoffice.staging.bsport.io
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: $CI_COMMIT_REF_NAME == "master"
      when: on_success
    - when: never
  variables:
    S3BUCKETNAME: cdn-staging-sandbox
    ENVIRONMENT: staging
    ACL_PARAM: '--acl public-read'
    CLOUDFRONT_ID: E1ZLJRXTF8O188
    SLACK_WEBHOOK_URL: "${SLACK_STAGING_WEBHOOK_URL}"
    CDN_DOMAIN: cdn.staging.bsport.io
    INVALIDATION_LAMBDA_URL: https://m4ptvmggmplbez5dwa7gkew4xa0bxjvd.lambda-url.eu-west-3.on.aws/

Build Deploy Production:
