  <!-- Insert Bsport Widget CDN -->
  <script id="insert-bsport-widget-cdn">
    !(function (b, s, p, o, r, t) {
      typeof window.BsportWidget === "undefined" &&
        !document.getElementById("bsport-widget-cdn") &&
        !(function () {
          (m = b.createElement(s)),
            (m.id = "bsport-widget-cdn"),
            (m.src = p),
            b.getElementsByTagName("head")[0].appendChild(m);
        })();
    })(document, "script", window.globalWidgetConfig.widgetScriptUrl);

    function MountBsportWidget(config, repeat = 1) {
      if (repeat > 50) {
        return;
      }
      if (!window.BsportWidget) {
        return setTimeout(
          () => {
            MountBsportWidget(config, repeat + 1);
          },
          100 * repeat || 1,
        );
      }
      BsportWidget.mount(config);
    }
  </script>

  <!-- Mount Bsport Widgets -->
  <script>
    MountBsportWidget({
      parentElement: "bsport-widget-937833",
      companyId: window.globalWidgetConfig.companyId,
      franchiseId: null,

      showFab: false,
