Deploy Widget Test Site:
  image: node:22-alpine
  stage: deploy
  interruptible: true
  allow_failure: true
  script:
    - echo "Deploying widget test site to https://bsport.gitlab.io/ichizen/..."
  pages:
    # The folder that contains the files to be exposed at the Page URL
    publish: apps/tools/widget-debugger/src/html
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
