image: node:alpine

variables:
  YARN_CACHE_DIR: "$CI_PROJECT_DIR/yarn-cache"

cache:
  paths:
    - "$YARN_CACHE_DIR"
    - "$CI_PROJECT_DIR/node_modules"
  key: "$CI_PROJECT_ID"

stages:
  - lint
  - test
  - build

before_script:
  - yarn config set cache-folder $YARN_CACHE_DIR
  - yarn install
  - du -hs $YARN_CACHE_DIR
  - du -hs "$CI_PROJECT_DIR/node_modules"

lint:
  stage: lint
  script:
    - yarn lint --quiet

test:
  stage: test
  script:
    - yarn test

build:
  stage: build
  script:
    - yarn build
  artifacts:
    paths:
      - build
    expire_in: 1 month

release on sentry:
  stage: build
  script:
    - yarn add @sentry/cli --dev
    - ./scripts/make-release.sh
  only:
    refs:
      - master

