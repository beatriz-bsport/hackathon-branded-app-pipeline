Ephemeral Environment:
  stage: deploy-feature-branch
  extends:
    - .ci-runner-xlarge-highcpu # 16 vCPU, 16GB RAM
  before_script: !reference [.pnpm-setup, before_script]
  environment:
    name: "preview-${CI_MERGE_REQUEST_IID}"
    url: "https://preview-${CI_MERGE_REQUEST_IID}.backoffice.chaos.bsport.io"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
  script:
    - echo "🔱 Building the ephemeral environment for this merge request"
    - bash tools/scripts/deploy-ephemeral-environment.sh dev dev true

Build Artifact Dev:
  stage: build
  needs: []
  extends:
    - .ci-runner-xlarge-highcpu # 16 vCPU, 16GB RAM
  before_script: !reference [.pnpm-setup, before_script]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: "never"
    - if: $CI_COMMIT_REF_NAME == "dev"
      when: "on_success"
    - if: $CI_COMMIT_BRANCH == "dev"
      when: "on_success"
  script:
    - echo "🔱 Building dev artifact"
    - bash tools/scripts/build-artifact.sh
