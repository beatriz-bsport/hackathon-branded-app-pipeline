Merge Request Open:
  image: ${REGISTRY_ENDPOINT}/${REGISTRY_NAME}:${CI_COMMIT_REF_SLUG}
  stage: merge-request-open
  interruptible: true

  tags:
    - build-frontend
    - cluster:bsport-tooling

  extends:
    - .before-script-install-node-modules

  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

  script:
    - git fetch origin $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
    - pnpm exec nx affected --target=ci:merge-request:open --base=origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME
