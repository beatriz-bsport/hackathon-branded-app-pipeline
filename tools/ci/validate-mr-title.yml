Validate MR Title:
  image: 672633452901.dkr.ecr.eu-west-3.amazonaws.com/dockerhub/commitizen/commitizen:4.12.1
  stage: init
  interruptible: true
  tags:
    - light
    - cluster:bsport-tooling
  script:
    - cz check --message "$CI_MERGE_REQUEST_TITLE" --allowed-prefixes --message-length-limit 80
  rules:
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "staging"
      when: "never"
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "production"
      when: "never"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
