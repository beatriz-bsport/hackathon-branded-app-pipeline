Release:Tag:
  extends:
    - .ci-runner-large-highcpu # 8 vCPU, 8GB RAM
  stage: post-deploy
  before_script: !reference [.pnpm-setup, before_script]
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
    RELEASE_TAG_DRY_RUN: "false"
  resource_group: release-tag
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
      variables:
        RELEASE_TAG_DRY_RUN: "true"
    - if: $CI_COMMIT_BRANCH == "dev" && $CI_PIPELINE_SOURCE == "push"
      when: on_success
    - if: $CI_COMMIT_BRANCH == "dev" && $CI_PIPELINE_SOURCE == "web"
      when: manual
  script:
    - git config --global user.email "contact@bsport.io"
    - git config --global user.name "bsport-bot"
    - |
      if [ "$RELEASE_TAG_DRY_RUN" != "true" ]; then
        if [ -z "$GIT_USERNAME" ] || [ -z "$GIT_PASSWORD" ]; then
          echo "Missing git push credentials: GIT_USERNAME/GIT_PASSWORD"
          exit 1
        fi

        ENCODED_GIT_USERNAME=$(python3 -c "import os, urllib.parse; print(urllib.parse.quote(os.environ['GIT_USERNAME'], safe=''))")
        ENCODED_GIT_PASSWORD=$(python3 -c "import os, urllib.parse; print(urllib.parse.quote(os.environ['GIT_PASSWORD'], safe=''))")

        git remote set-url origin "https://${ENCODED_GIT_USERNAME}:${ENCODED_GIT_PASSWORD}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      fi
    - git fetch origin --tags --force
    - |
      if [ "$RELEASE_TAG_DRY_RUN" = "true" ]; then
        pnpm exec nx run @bsport/nx:release-tag --dryRun
      else
        pnpm exec nx run @bsport/nx:release-tag
      fi
