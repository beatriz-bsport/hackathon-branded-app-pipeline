[tools]
node = "24.13.0"
pnpm = "10.11.0"
"1password-cli" = "latest"

[settings]
# Disable GPG verification to avoid signature check failures during Node installation
node.gpg_verify = false

[env]
# NX Remote Cache credentials from 1Password
# - Uses `tools = true` to defer evaluation until after mise installs tools (avoids bootstrap errors)
# - Set DISABLE_NX_REMOTE_CACHE=1 to opt-out of remote caching
# - Credentials are cached for 1 day; run `mise cache clear` to refresh
NX_SELF_HOSTED_REMOTE_CACHE_SERVER = { value = "{{ exec(command='[ \"${DISABLE_NX_REMOTE_CACHE:-0}\" = \"1\" ] || op read \"op://Engineering/NX remote cache server/hostname\" --no-newline 2>/dev/null || echo \"\"', cache_key='nx-cache-server', cache_duration='1d') }}", tools = true }
NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN = { value = "{{ exec(command='[ \"${DISABLE_NX_REMOTE_CACHE:-0}\" = \"1\" ] || op read \"op://Engineering/NX remote cache server/credential\" --no-newline 2>/dev/null || echo \"\"', cache_key='nx-cache-token', cache_duration='1d') }}", tools = true }
