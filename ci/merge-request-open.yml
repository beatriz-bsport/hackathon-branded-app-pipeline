Merge Request Open:
  image: node:22-alpine
  stage: merge-request-open

  tags:
    - build-frontend
    - cluster:bsport-tooling

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

  script:
    - git fetch origin $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
    - pnpm exec nx affected --target=ci:merge-request:open --base=origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME
