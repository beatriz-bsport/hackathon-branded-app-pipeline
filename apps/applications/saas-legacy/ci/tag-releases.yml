.Tag today production release:
  stage: tag-releases
  tags:
    - light
    - cluster:bsport-tooling

  script:
    - git config --global user.email "contact@bsport.io"
    - git config --global user.name "bsport-bot"
    - echo "Cloning locally bsport-saas repository"
    - mkdir /tmp/repo/
    - cd /tmp/repo/
    - git clone https://${GIT_USERNAME}:${GIT_PASSWORD}@gitlab.com/bsport/bsport-saas
    - git checkout production
    - TODAY_TAG=release-`date +%F`
    - git tag $TODAY_TAG
    - git push origin $TODAY_TAG
    - git checkout master
    - STAGING_TODAY_TAG=staging-`date +%F`
    - git tag $STAGING_TODAY_TAG
    - git push origin $STAGING_TODAY_TAG
    - git checkout dev
    - DEV_TODAY_TAG=dev-`date +%F`
    - git tag $DEV_TODAY_TAG
    - git push origin $DEV_TODAY_TAG

Tag today production release scheduled:
  extends: .Tag today production release
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $TRIGGERED_JOB == "tag-releases"'
