image: 672633452901.dkr.ecr.eu-west-3.amazonaws.com/bsport-infra/gitlab-build-ichizen:v1.0.2

variables:
  AWS_REGION: eu-west-3
  REGISTRY_ENDPOINT: 672633452901.dkr.ecr.eu-west-3.amazonaws.com
  REGISTRY_NAME: bsport/bsport-ichizen-builder
  PNPM_HOME: "/builds/bsport/ichizen/.pnpm"
  NX_TUI: "false"
  NX_SELF_HOSTED_REMOTE_CACHE_SERVER: $CI_NX_SELF_HOSTED_REMOTE_CACHE_SERVER
  NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: $CI_NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm/store
  policy: pull-push

stages:
  - init
  - analyze
  - deploy-feature-branch
  - deploy
  - post-deploy

default:
  tags:
    - build-frontend
    - cluster:bsport-tooling

include:
  - project: "bsport/bsport-platform-ci-templates"
    file: "/includes/ci.yaml"
  - local: "/tools/ci/common.yml"
  - local: "/tools/ci/validate-mr-title.yml"
  - local: "/tools/ci/merge-request-open.yml"
  - local: "/tools/ci/analyze.yml"
  - local: "/tools/ci/deploy-feature-branch.yml"
  - local: "/tools/ci/deploy-environment.yml"
  - local: "/tools/ci/merge-branches.yml"
  - local: "/tools/ci/e2e.yml"
  - local: "/tools/ci/security-scan.yml"

workflow:
  rules:
    # Prevent that pushing on a MR creates dupplicate pipelines ("push" and "merge_request_event")
    # We keep both events for dev and staging branches to allow deployments even if a MR is opened
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH != "dev" && $CI_COMMIT_BRANCH != "staging"
      when: never
    # Skip pipelines for draft merge requests
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE =~ /^(\[Draft\]|\(Draft\)|Draft:)/
      when: never
    # Default behaviour : fallback to Job rules
    - when: always
