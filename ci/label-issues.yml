.Label issues Base:
  image: 672633452901.dkr.ecr.eu-west-3.amazonaws.com/bsport-infra/gitlab-build-docker:v1.0.1
  stage: label-issues
  tags:
    - light
    - cluster:bsport-tooling
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_TAG =~ /deploy-/
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: $CI_COMMIT_REF_NAME == "dev"
      when: always
    - if: $CI_COMMIT_REF_NAME == "master"
      when: always
    - if: $CI_COMMIT_REF_NAME == "production"
      when: always
    - when: never
  script: ./scripts/label-gitlab-issue.sh
  allow_failure: true

Label issue dev:
  extends: .Label issues Base
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_TAG =~ /deploy-/
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: $CI_COMMIT_REF_NAME == "dev"
      when: always
    - when: never
  variables:
    ENVIRONMENT: dev
    SOURCE_BRANCH: dev
    DEST_BRANCH: master

Label issue staging:
  extends: .Label issues Base
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_TAG =~ /deploy-/
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: $CI_COMMIT_REF_NAME == "master"
      when: always
    - when: never
  variables:
    ENVIRONMENT: staging
    SOURCE_BRANCH: master
    DEST_BRANCH: production

Label issue production:
  extends: .Label issues Base
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_TAG =~ /deploy-/
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: $CI_COMMIT_REF_NAME == "production"
      when: always
    - when: never
  variables:
    ENVIRONMENT: production
    SOURCE_BRANCH: production
