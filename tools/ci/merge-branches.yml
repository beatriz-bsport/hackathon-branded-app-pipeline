# Reusable template for automatic branch merging
.auto-merge-template: &auto-merge-template
  stage: post-deploy
  image: 672633452901.dkr.ecr.eu-west-3.amazonaws.com/bsport-infra/gitlab-build-docker:v1.1.0
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  before_script:
    # Configure git
    - git config --global user.email "contact@bsport.io"
    - git config --global user.name "bsport-bot"
    # Set up authentication using Username and Password
    - git remote set-url origin "https://${GIT_USERNAME}:${GIT_PASSWORD}@gitlab.com/${CI_PROJECT_PATH}.git"
  allow_failure: true # Don't fail the entire pipeline if merge conflicts occur
  tags:
    - light
    - cluster:bsport-tooling
  script:
    - |
      echo "Starting merge from ${SOURCE_BRANCH} to ${TARGET_BRANCH}..."

      # Fetch all branches
      git fetch origin

      # Create target branch
      git checkout -B ${TARGET_BRANCH} origin/${TARGET_BRANCH}

      # Get commit messages that will be merged
      COMMIT_MESSAGES=$(git log --oneline origin/${TARGET_BRANCH}..origin/${SOURCE_BRANCH} --pretty=format:"• %s (%an)" | head -20)
      COMMIT_COUNT=$(git rev-list --count origin/${TARGET_BRANCH}..origin/${SOURCE_BRANCH})

      # Attempt to merge source into target
      if git merge origin/${SOURCE_BRANCH} --no-commit --no-ff; then
        echo "✅ Merge successful - no conflicts detected"

        # Complete the merge
        git commit -m "chore: merge ${SOURCE_BRANCH} into ${TARGET_BRANCH}"
          
        # Push the changes
        git push origin ${TARGET_BRANCH}

        echo "Successfully merged ${SOURCE_BRANCH} into ${TARGET_BRANCH}"

        # Send success notification to Slack using jq for safe JSON encoding
        if [ -n "$SLACK_DEV_WEBHOOK_URL" ]; then
          MESSAGE=$(printf "✅ Successfully merged \`%s\` into \`%s\` branch on repo <%s|%s>\n\n*%s commits merged:*\n%s" \
            "${SOURCE_BRANCH}" "${TARGET_BRANCH}" \
            "https://gitlab.com/${CI_PROJECT_PATH}" "${CI_PROJECT_NAME}" \
            "${COMMIT_COUNT}" "${COMMIT_MESSAGES}")
          
          jq -n \
            --arg text "$MESSAGE" \
            --arg username "GitLab CI" \
            --arg icon_emoji ":gitlab:" \
            '{
              text: $text,
              username: $username,
              icon_emoji: $icon_emoji
            }' | curl -X POST -H 'Content-type: application/json' \
            --data @- \
            "$SLACK_DEV_WEBHOOK_URL"
        fi
          
      else
        echo "❌ Merge conflicts detected!"
        
        # Abort the merge
        git merge --abort

        # Send conflict notification to Slack using jq for safe JSON encoding
        if [ -n "$SLACK_DEV_WEBHOOK_URL" ]; then
          jq -n \
            --arg text "⚠️ *MERGE CONFLICTS DETECTED* ⚠️\n\nFailed to automatically merge \`${SOURCE_BRANCH}\` into \`${TARGET_BRANCH}\` branch on repo <https://gitlab.com/${CI_PROJECT_PATH}|${CI_PROJECT_NAME}>\n\n*Action Required:*\n• Manual intervention needed to resolve conflicts\n• Please merge \`${SOURCE_BRANCH}\` into \`${TARGET_BRANCH}\` manually\n• Project: ${CI_PROJECT_NAME}\n• Pipeline: ${CI_PIPELINE_URL}\n• Author: ${GITLAB_USER_NAME}" \
            --arg username "GitLab CI" \
            --arg icon_emoji ":warning:" \
            '{
              text: $text,
              username: $username,
              icon_emoji: $icon_emoji
            }' | curl -X POST -H 'Content-type: application/json' \
            --data @- \
            "$SLACK_DEV_WEBHOOK_URL"
        fi
        
        # Exit with error to mark job as failed
        exit 1
      fi

# Merge production to staging after production deployment
merge-production-to-staging:
  <<: *auto-merge-template
  resource_group: merge-production-to-staging
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
    SOURCE_BRANCH: "production"
    TARGET_BRANCH: "staging"
  rules:
    # Only run when pushing to production branch
    - if: $CI_COMMIT_BRANCH == "production" && $CI_PIPELINE_SOURCE == "push"
      when: on_success

# Merge staging to dev after staging deployment
merge-staging-to-dev:
  <<: *auto-merge-template
  resource_group: merge-staging-to-dev
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
    SOURCE_BRANCH: "staging"
    TARGET_BRANCH: "dev"
  rules:
    # Only run when pushing to staging branch
    - if: $CI_COMMIT_BRANCH == "staging" && $CI_PIPELINE_SOURCE == "push"
      when: on_success
