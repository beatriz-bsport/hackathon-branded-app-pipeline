language: en-US
tone_instructions: ""
early_access: false
enable_free_tier: true
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  commit_status: true # Shows CodeRabbit review status in a CI job
  review_status: true # Shows and updates CodeRabbit review status in a MR comment
  fail_commit_status: false
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: true
  related_prs: true
  poem: false
  labeling_instructions: []
  path_filters: []
  path_instructions:
    # 1. General guideline location reference
    - path: "**/*"
      instructions: >-
        When making a code review, ensure that you check for adherence to
        the coding guidelines specified in .ai/guidelines.

    # 2. How to use guideline metadata
    - path: "**/*"
      instructions: >-
        When making a code review and using guidelines from
        .ai/guidelines, use the guideline metadata to guide your
        behaviour. The Level and Importance fields must be used to
        determine the severity of the review comment. The Scope field
        determines when a guideline must be enforced.

    # 3. NEW: Thoroughness and systematic enforcement
    - path: "**/*"
      instructions: |
        ENFORCE ALL GUIDELINES SYSTEMATICALLY:
        1. Check every guideline in .ai/guidelines against code changes
        2. Verify all Blocking and Warning level rules are respected
        3. Ensure Best practice guidelines are followed where applicable
        4. Cross-reference using Scope tags to identify relevant guidelines
        5. Always cite guideline title when reporting violations
        Be comprehensive - do not skip any guidelines.

    # 4. Citation format
    - path: "**/*"
      instructions: >-
        When making review comments that relate to coding guidelines in
        .ai/guidelines, always quote the specific guideline title
        being referenced to make it clear which guideline is being applied.

  abort_on_close: true
  auto_review:
    enabled: true
    auto_incremental_review: true
    ignore_title_keywords: []
    labels: []
    drafts: false
    base_branches: []
  finishing_touches:
    docstrings:
      enabled: true
  tools:
    shellcheck:
      enabled: true
    ruff:
      enabled: true
    markdownlint:
      enabled: true
    github-checks:
      enabled: true
      timeout_ms: 90000
    languagetool:
      enabled: true
      enabled_only: false
      level: default
      enabled_rules: []
      disabled_rules: []
      enabled_categories: []
      disabled_categories: []
    biome:
      enabled: true
    hadolint:
      enabled: true
    yamllint:
      enabled: true
    gitleaks:
      enabled: true
    checkov:
      enabled: true
    buf:
      enabled: true
    regal:
      enabled: true
    actionlint:
      enabled: true
    pmd:
      enabled: true
    semgrep:
      enabled: true
    ast-grep:
      rule_dirs: []
      util_dirs: []
      essential_rules: true
      packages: []
chat:
  auto_reply: true
  integrations:
    linear:
      usage: auto
knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  learnings:
    scope: auto
  issues:
    scope: auto
  jira:
    usage: auto
    project_keys: []
  linear:
    usage: auto
    team_keys:
      - BOO
  pull_requests:
    scope: auto
  code_guidelines:
    enabled: true
    filePatterns:
      - ".ai/guidelines/**"
      - "**/README.md"
code_generation:
  docstrings:
    language: en-US
