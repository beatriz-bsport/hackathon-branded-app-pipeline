.Build widget:
  stage: build-widget
  allow_failure: true
  trigger:
    project: bsport/bsport-widget

Build widget dev:
  extends: .Build widget
  interruptible: true
  trigger:
    branch: dev
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: $CI_COMMIT_REF_NAME == "dev"
      when: on_success
    - if: $CI_COMMIT_TAG =~ /deploy-/
      when: never
    - when: never

Build widget staging:
  extends: .Build widget
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: $CI_COMMIT_REF_NAME == "master"
      when: on_success
    - if: $CI_COMMIT_TAG =~ /deploy-/
      when: never
    - when: never
  trigger:
    branch: master

Build widget production:
  extends: .Build widget
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: $CI_COMMIT_REF_NAME == "production"
      when: on_success
    - if: $CI_COMMIT_TAG =~ /deploy-/
      when: never
    - when: never
  trigger:
    branch: production
