image: 672633452901.dkr.ecr.eu-west-3.amazonaws.com/bsport-infra/gitlab-build-frontend:latest

variables:
  AWS_REGION: eu-west-3
  REGISTRY_ENDPOINT: 672633452901.dkr.ecr.eu-west-3.amazonaws.com

#Cache dependencies across all jobs

stages:
  - prepare-image-docker
  - static-analysis
  # - unit_tests
  # - e2e_tests
  - bump-version
  - build-deploy
  - build-widget
  - promote
  - label-issues
  - build-widget

.Build widget:
  stage: build-widget
  allow_failure: true
  trigger:
    project: bsport/bsport-widget 

Build widget dev:
  extends: .Build widget
  trigger:
    branch: dev
  only:
    refs:
      - dev

Build widget staging:
  extends: .Build widget
  only:
    refs:
      - master
  trigger:
    branch: master 

Build widget production:
  extends: .Build widget
  only:
    refs:
      - production
  trigger:
    branch: production

before_script:
  - OLD_VERSION=`echo "$(cat ./VERSION)"`

Prepare Docker Builder Image:
  image: 672633452901.dkr.ecr.eu-west-3.amazonaws.com/bsport-infra/gitlab-build-docker:v1.0.1
  tags:
    - deployment
    - kubernetes
  stage: prepare-image-docker
  retry: 
    max: 2
  script:
    - aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${REGISTRY_ENDPOINT}
    - docker build --network host -t ${REGISTRY_ENDPOINT}/bsport/bsport-saas-builder:${CI_COMMIT_REF_NAME} .
    - docker push ${REGISTRY_ENDPOINT}/bsport/bsport-saas-builder:${CI_COMMIT_REF_NAME}

Lint:
  image: ${REGISTRY_ENDPOINT}/bsport/bsport-saas-builder:${CI_COMMIT_REF_NAME}
  stage: static-analysis
  tags:
    - high-ram
    - kubernetes
  script:
    - mv /app/node_modules .
    - yarn install --frozen-lockfile # just to be sure
    - yarn lint 


  except:
    - master
    - production

Test:
  image: ${REGISTRY_ENDPOINT}/bsport/bsport-saas-builder:${CI_COMMIT_REF_NAME}
  stage: static-analysis
  tags:
    - light
    - kubernetes
  script:
    - mv /app/node_modules .
    - yarn install --frozen-lockfile # just to be sure
    - yarn test

  except:
    - master
    - production

