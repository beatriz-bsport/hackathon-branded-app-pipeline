Lint:
  interruptible: true
  tags:
    - deployment
    - cluster:bsport-tooling
  image: ${REGISTRY_ENDPOINT}/bsport/bsport-widget-builder:${CI_COMMIT_REF_NAME}
  stage: static-analysis
  variables:
    ENVIRONMENT: dev
  script:
    - cd /@bsport/saas-legacy/
    - pnpm run link
    - cd /app/
    - pnpm run link @bsport/saas-legacy
    - pnpm run lint

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
      when: never
    - if: $CI_COMMIT_TAG =~ /deploy-frontend-only-/
      when: on_success
    - when: never
    - if: $CI_COMMIT_REF_NAME == "production"
      when: never
    - if: $CI_COMMIT_REF_NAME == "master"
      when: never
    - when: on_success
