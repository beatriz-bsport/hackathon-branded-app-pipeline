# Create / Update a Docker Image store on an ECR to reuse it for other Jobs
Prepare Builder:
  image: ${REGISTRY_ENDPOINT}/bsport-infra/gitlab-build-docker:v1.1.0
  stage: prepare-builder
  tags:
    - build-frontend
    - cluster:bsport-tooling
  retry:
    max: 2
  services:
    - name: ${REGISTRY_ENDPOINT}/bsport-infra/dind:1.0.2
      alias: docker
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: "never"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_REF_NAME == "main"
      interruptible: false
    - if: $CI_COMMIT_REF_NAME == "staging"
      interruptible: false
    - interruptible: true
      when: "on_success"
  variables:
    # Required variables to init docker daemon
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    DOCKER_HOST: tcp://docker:2375
    TAG: "$CI_COMMIT_REF_SLUG"
  script:
    # Wait for Docker service to be up and running
    - sleep 10 # Mitigates race condition with Docker service initialization (cf issue 478)
    # Authenticate with AWS ECR
    - echo "Authenticating to AWS ECR..."
    - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $REGISTRY_ENDPOINT
    # Pull the most appropriate image for caching layers
    - echo "Determining the best image to reuse for caching..."
    - |
      if docker pull "$REGISTRY_ENDPOINT/$REGISTRY_NAME:$TAG"; then
        USED_IMAGE_TAG=$TAG
      else
        echo "Falling back to 'dev' image if it exists."
        USED_IMAGE_TAG=dev
        docker pull "${REGISTRY_ENDPOINT}/${REGISTRY_NAME}:dev" || echo "No 'dev' image found."
      fi
    - echo "Using image tag ~> $USED_IMAGE_TAG"
    - DOCKER_IMAGE_FULL_NAME="$REGISTRY_ENDPOINT/$REGISTRY_NAME:$TAG"
    # Build the Docker image with caching enabled
    - echo "Building Docker image..."
    - docker build
      --build-arg BUILDKIT_INLINE_CACHE=1
      --cache-from "$REGISTRY_ENDPOINT/$REGISTRY_NAME:$USED_IMAGE_TAG"
      --network host
      -t $DOCKER_IMAGE_FULL_NAME
      .
    # Push the newly built Docker image
    - echo "Pushing Docker image..."
    - docker push $DOCKER_IMAGE_FULL_NAME
