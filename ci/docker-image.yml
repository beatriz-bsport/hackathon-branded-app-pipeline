Prepare Docker Builder Image:
  image: 672633452901.dkr.ecr.eu-west-3.amazonaws.com/bsport-infra/gitlab-build-docker:v1.1.0
  tags:
    - build-frontend
    - cluster:bsport-tooling
  stage: prepare-image-docker
  retry:
    max: 2
  script:
    - sleep 10 # because the docker service needs to be up'd cf https://gitlab.com/gitlab-org/charts/gitlab/-/issues/478
    - aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${REGISTRY_ENDPOINT}
    - echo "Pulling most fitted image for reusing layers"
    - USED_IMAGE_TAG=dev
    - docker pull ${REGISTRY_ENDPOINT}/${REGISTRY_NAME}:${TAG} && USED_IMAGE_TAG=$TAG || true
    - '[ $USED_IMAGE_TAG = dev ] && docker pull ${REGISTRY_ENDPOINT}/${REGISTRY_NAME}:dev || true'
    - echo "Will try to reuse image $#USED_IMAGE_TAG}"
    - docker build
      --build-arg BUILDKIT_INLINE_CACHE=1 
      --cache-from ${REGISTRY_ENDPOINT}/${REGISTRY_NAME}:${USED_IMAGE_TAG}
      --network host
      -t ${REGISTRY_ENDPOINT}/${REGISTRY_NAME}:${TAG}
      .
    - docker push ${REGISTRY_ENDPOINT}/${REGISTRY_NAME}:${TAG}
  variables:
    DOCKER_TLS_CERTDIR: ''
    DOCKER_DRIVER: overlay2
    DOCKER_HOST: tcp://docker:2375
    REGISTRY_NAME: bsport/bsport-saas-builder
    TAG: $CI_COMMIT_REF_NAME
  services:
    - name: 672633452901.dkr.ecr.eu-west-3.amazonaws.com/bsport-infra/dind:1.0.2
      alias: docker
