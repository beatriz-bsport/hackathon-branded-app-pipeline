image: 672633452901.dkr.ecr.eu-west-3.amazonaws.com/bsport-infra/gitlab-build-frontend:latest

variables:
  YARN_CACHE_DIR: "$CI_PROJECT_DIR/yarn-cache"
  CYPRESS_CACHE_FOLDER: "$CI_PROJECT_DIR/cache/Cypress"

#Cache dependencies across all jobs

stages:
  - lint
  # - unit_tests
  # - e2e_tests
  - auto-bump
  - configure_and_deploy
  - promote

before_script:
  - yarn config set cache-folder $YARN_CACHE_DIR 
  - yarn install --frozen-lockfile 
  - OLD_VERSION=`echo "$(cat ./versionning/VERSION)"`

lint:
  stage: lint
  tags:
    - deployment
  script:
    - yarn lint --quiet

  except:
    - master
    - ci-cd/semantic-versionning
 

Release Staging:
  stage: promote
  image: 672633452901.dkr.ecr.eu-west-3.amazonaws.com/bsport-infra/gitlab-build-docker:latest
  when: manual
  tags:
    - deployment
  only:
    refs:
      - dev

  before_script:
    - echo 'Overriding yarn before_script'

  script:
    - git remote set-url origin https://${GIT_USERNAME}:${GIT_PASSWORD}@gitlab.com/bsport/bsport-saas.git
    - git config --global user.email "contact@bsport.io"
    - git config --global user.name "bsport-bot"
    - git fetch
    - git rebase master
    - git push -f
    - git checkout master
    - git merge dev
    - git push




Auto Bump Version:
  image: 672633452901.dkr.ecr.eu-west-3.amazonaws.com/bsport-infra/gitlab-build-docker:latest
  stage: auto-bump
  tags:
    - deployment
  only:
    - dev
    - ci-cd/semantic-versionning
  before_script:
    - echo 'Overriding default before_script instruction relying on yarn'

  script:
    - echo $CI_COMMIT_REF_NAME
    - export CHANGELOG_FILE=CHANGELOG.${CI_COMMIT_REF_NAME}
    - envsubst "$(printf '${%s} ' $(env | sed 's/=.*//'))"  > .cz < .cz
    - cat .cz
    - git remote -v
    - git remote set-url origin https://${GIT_USERNAME}:${GIT_PASSWORD}@gitlab.com/bsport/bsport-saas.git
    - git config --global user.email "contact@bsport.io"
    - git config --global user.name "bsport-bot"
    - 'exists=`git show-ref refs/heads/${CI_COMMIT_REF_NAME}` && if [ -n "$exists" ]; then git branch -D ${CI_COMMIT_REF_NAME}; fi'
    - git checkout -b $CI_COMMIT_REF_NAME

    - 'cz bump --check-consistency --changelog && SHOULD_PUSH=1 || SHOULD_PUSH=0;'


    - VERSION=`echo "$(cat ./VERSION)"`
    - echo $VERSION
    - echo "#!/bin/sh" >> variables
    - echo "export TAG='$VERSION'" >> variables

    - '[[ $SHOULD_PUSH = 1 ]] && git push origin $CI_COMMIT_REF_NAME:$CI_COMMIT_REF_NAME || echo "no code to push"'
    - '[[ $SHOULD_PUSH = 1 ]] && git push origin $CI_COMMIT_REF_NAME:$CI_COMMIT_REF_NAME --tags || echo "no tag to push"'

  artifacts:
    paths:
      - variables

.Build and deploy Base:
  stage: configure_and_deploy
  cache:
    key: yarn
    paths:
        - "$YARN_CACHE_DIR"
        - "$CYPRESS_CACHE_FOLDER/node_modules"
        - node_modules
  tags:
    - deployment
  only:
    refs:
      - dev
      - master
  script:
    - echo "FAILED" > .job_status
    - VERSION=`echo "$(cat ./VERSION)"`
    - echo "Preparing VERSION:${VERSION} on ${ENVIRONMENT}"
    - echo "export default '$VERSION';" > src/release.js
    - yarn updateTranslation
    - yarn build
    - mv envs/$ENVIRONMENT build/env.js
    - yarn add @sentry/cli
    - export SENTRY_NO_PROGRESS_BAR=1
    - ./scripts/prepare-sentry-release.sh $VERSION $FRONTEND_URL
    - rm ./build/static/js/*.js.map
    - aws s3 cp ./build/ $S3_BUCKET --recursive --only-show-errors
    - aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_ID --paths /index.html /env.js /service-worker.js /manifest.json
    - scripts/prepare-sentry-deploy.sh $VERSION $ENVIRONMENT
    - echo "SUCCESS" > .job_status
    - cat .job_status

  after_script:
    - STATUS=`echo "$(cat .job_status)"`
    - cat .job_status
    - export STATUS
    - '[[ "$STATUS" = "SUCCESS" ]] && COLOR="#36a64f" || COLOR="#E00201"'
    - '[[ "$STATUS" = "SUCCESS" ]] && SUCCESS_ICON="https://pluspng.com/img-png/success-png-success-icon-image-23194-400.png" || SUCCESS_ICON="http://www.pngall.com/wp-content/uploads/2016/06/Fail-Stamp-PNG-Clipart.png"'
    - export SUCCESS_ICON

    - VERSION=`echo "$(cat ./versionning/VERSION)"`
    - '[[ $VERSION != $OLD_VERSION} ]] && CHANGELOG=`git grep -B 200 ${OLD_VERSION} CHANGELOG.md | grep -A ${VERSION} || echo="Unable to find release note";` || CHANGELOG="Technical release";'
    - export CHANGELOG

    - envsubst < ./slack_template.json > slack_template2.json
    - 'curl -s -d @slack_template2.json --header "Content-Type: application/json" "${SLACK_WEBHOOK_URL}" || exit 0'

Buid Deploy Staging:
  extends: .Build and deploy Base
  only:
    refs:
      - master
  variables:
    ENVIRONMENT: staging
    FRONTEND_URL: backoffice.staging.bsport.io
    S3_BUCKET: s3://bsport-eu-backoffice-staging/ 
    CLOUDFRONT_ID: E3HVVKK3QMOC4B 
    SLACK_WEBHOOK_URL: "${SLACK_STAGING_WEBHOOK_URL}"

Buid Deploy Dev:
  extends: .Build and deploy Base
  only:
    refs:
      - dev
  variables:
    ENVIRONMENT: dev
    FRONTEND_URL: backoffice.dev.bsport.io
    S3_BUCKET: s3://bsport-eu-backoffice-dev/ 
    CLOUDFRONT_ID: E17M3KEJFTN7MM
    SLACK_WEBHOOK_URL: "${SLACK_DEV_WEBHOOK_URL}"

