.Auto Bump Version Base:
  image: 672633452901.dkr.ecr.eu-west-3.amazonaws.com/bsport-infra/gitlab-build-docker:latest
  stage: bump-version
  tags:
    - light
    - kubernetes
  allow_failure: true
  only:
    - master
    - production
  before_script:
    - echo 'Overriding default before_script instruction relying on yarn'

  script:
    - echo $CI_COMMIT_REF_NAME
    - envsubst "$(printf '${%s} ' $(env | sed 's/=.*//'))"  > .cz < .cz
    - cat .cz
    - git remote -v
    - git remote set-url origin https://${GIT_USERNAME}:${GIT_PASSWORD}@gitlab.com/bsport/bsport-saas.git
    - git config --global user.email "contact@bsport.io"
    - git config --global user.name "bsport-bot"
    - git fetch --tags
    - 'exists=`git show-ref refs/heads/${CI_COMMIT_REF_NAME}` && if [ -n "$exists" ]; then git branch -D ${CI_COMMIT_REF_NAME}; fi'
    - git checkout -b $CI_COMMIT_REF_NAME

    - '[[ $PRERELEASE ]] && cz bump --check-consistency --yes --changelog --prerelease $PRERELEASE && SHOULD_PUSH=1 || SHOULD_PUSH=0;'
    - 'cz bump --check-consistency --yes --changelog --prerelease $PRERELEASE && SHOULD_PUSH=1 || SHOULD_PUSH=0;'
    - VERSION=`echo "$(cat ./VERSION)"`
    - echo $VERSION
    - echo "#!/bin/sh" >> variables
    - echo "export TAG='$VERSION'" >> variables

    - 'git push origin $CI_COMMIT_REF_NAME:$CI_COMMIT_REF_NAME --follow-tags || echo "no code to push"'
    - ./scripts/release-gitlab.sh $VERSION  $CI_PROJECT_ID

  artifacts:
    paths:
      - variables

