Analyze:
  image: ${REGISTRY_ENDPOINT}/${REGISTRY_NAME}:${CI_COMMIT_REF_SLUG}
  stage: analyze
  interruptible: true
  tags:
    - build-frontend
    - cluster:bsport-tooling
  extends:
    - .before-script-install-node-modules
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - NX_BASE=$CI_MERGE_REQUEST_TARGET_BRANCH_NAME
    - git fetch origin $NX_BASE
    - echo "🔱 These are the affected projects :"
    - AFFECTED_PROJECTS=$(pnpm exec nx show projects --affected --base=origin/$NX_BASE --head=HEAD)
    - echo $AFFECTED_PROJECTS
    - echo "*"
    - echo "⏳ Verify all our packages versions are synchronized and checking integrity rules"
    - pnpm run sync:mismatch:list
    - echo "✅ All dependencies are well configured !"
    - echo "*"
    - echo "⏳ Check there are no duplicate dependencies"
    - pnpm dedupe --check
    - echo "✅ pnpm-lock.yaml is clean !"
    - echo "*"
    - echo "⏳ Compile ichizen affected projects with Typescript"
    - pnpm exec nx affected --target=ci:compile --base=origin/$NX_BASE
    - echo "✅ All ichizen affected projects have been compiled with Typescript"
    - echo "*"
    - echo "⏳ Execute federation-config test when affected"
    - pnpm exec nx affected --target=test --base=origin/$NX_BASE --exclude='*,!tag:execute:unit-tests'
    - echo "✅ federation-config tests have been executed if affected"
    - echo "*"
    - echo "⏳ Lint ichizen affected projects"
    - pnpm exec nx affected --target=lint --base=origin/$NX_BASE
    - echo "✅ All ichizen affected projects have been linted"
    - echo "*"
    - echo "⏳ Check that affected files are formatted correctly"
    - pnpm exec nx affected --target=pretty,format:check --base=origin/$NX_BASE
    - pnpm exec prettier --check package.json
    - echo "✅ All affected projects are well formated"
    - echo "*"
    - echo "⏳ Lint legacy affected projects"
    - pnpm exec nx affected --target=lint-old --base=origin/$NX_BASE
    - echo "✅ All legacy affected projetcs have been linted"
    - echo "*"
    - echo "⏳ Check translations files have been commited"
    - SAAS_LEGACY_AFFECTED=$(echo $(echo "$AFFECTED_PROJECTS" | grep '@bsport/saas-legacy' | wc -l | tr -d ' '))
    - |
      if [ "$SAAS_LEGACY_AFFECTED" -eq "1" ]; then
        echo "❗ @bsport/saas-legacy has been changed. Checking translations."
        pnpm exec nx translation:update @bsport/saas-legacy
      fi
    - pnpm run -w translation:update
    - NB_LOCALES_DIFF=$(echo $(git diff HEAD --name-only | grep '/locales' | wc -l | tr -d ' '))
    - |
      if [ "$NB_LOCALES_DIFF" != "0" ]; then
        echo "❗ Detected changes in **/locales files that have not been commited ❗"
        exit 1
      fi
    - echo "✅ All translations have been managed as expected"

# Run gitleaks secret detection on changed files only
gitleaks:
  stage: analyze
  image: zricethezav/gitleaks:v8.28.0
  tags: ["cluster:bsport-tooling", "light"]
  script:
    - git config --global --add safe.directory $CI_PROJECT_DIR
    - git fetch origin $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
    - git fetch origin merge-requests/$CI_MERGE_REQUEST_IID/head:mr-ref
    - |
      gitleaks git -v --redact --log-opts="origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME..mr-ref" . \
      || {
         echo "⚠️ Gitleaks detected a secret, please see the documentation: https://gitlab.com/bsport/ichizen/-/blob/dev/docs/gitleaks.md#dealing-with-gitleaks-detections";
         exit 1;
        }
  rules:
    - if: $CI_MERGE_REQUEST_ID
  retry:
    max: 2
    when:
      - runner_system_failure
      - unknown_failure
