Release:Tag:
  extends:
    - .ci-runner-large-highcpu # 8 vCPU, 8GB RAM
  stage: post-deploy
  before_script: !reference [.pnpm-setup, before_script]
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
    RELEASE_TAG_DRY_RUN: "false"
    RELEASE_TAG_HOTFIX: "false"
    RELEASE_TAG_OUTPUT_FILE: "release-tag.env"
  resource_group: release-tag
  artifacts:
    reports:
      dotenv: release-tag.env
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^hotfix\/v[0-9]+\.[0-9]+\.x$/
      when: manual
      allow_failure: true
      variables:
        RELEASE_TAG_DRY_RUN: "true"
        RELEASE_TAG_HOTFIX: "true"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
      variables:
        RELEASE_TAG_DRY_RUN: "true"
    - if: $CI_COMMIT_BRANCH == "dev" && $CI_PIPELINE_SOURCE == "push"
      when: on_success
    - if: $CI_COMMIT_BRANCH == "dev" && $CI_PIPELINE_SOURCE == "web"
      when: manual
    - if: $CI_COMMIT_BRANCH =~ /^hotfix\/v[0-9]+\.[0-9]+\.x$/ && $CI_PIPELINE_SOURCE == "push"
      when: on_success
      variables:
        RELEASE_TAG_HOTFIX: "true"
    - if: $CI_COMMIT_BRANCH =~ /^hotfix\/v[0-9]+\.[0-9]+\.x$/ && $CI_PIPELINE_SOURCE == "web"
      when: manual
      variables:
        RELEASE_TAG_HOTFIX: "true"
  script:
    - git config --global user.email "contact@bsport.io"
    - git config --global user.name "bsport-bot"
    - |
      if [ "$RELEASE_TAG_DRY_RUN" != "true" ]; then
        if [ -n "$GIT_USERNAME" ] && [ -n "$GIT_PASSWORD" ]; then
          ENCODED_GIT_USERNAME=$(python3 -c "import os, urllib.parse; print(urllib.parse.quote(os.environ['GIT_USERNAME'], safe=''))")
          ENCODED_GIT_PASSWORD=$(python3 -c "import os, urllib.parse; print(urllib.parse.quote(os.environ['GIT_PASSWORD'], safe=''))")
        elif [ -n "$CI_JOB_TOKEN" ]; then
          ENCODED_GIT_USERNAME="gitlab-ci-token"
          ENCODED_GIT_PASSWORD=$(python3 -c "import os, urllib.parse; print(urllib.parse.quote(os.environ['CI_JOB_TOKEN'], safe=''))")
        else
          echo "Missing git push credentials: GIT_USERNAME/GIT_PASSWORD or CI_JOB_TOKEN"
          exit 1
        fi

        git remote set-url origin "https://${ENCODED_GIT_USERNAME}:${ENCODED_GIT_PASSWORD}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      fi
    - git fetch origin --tags --force
    - |
      RELEASE_TAG_ARGS="--outputFile=$RELEASE_TAG_OUTPUT_FILE"

      if [ "$RELEASE_TAG_DRY_RUN" = "true" ]; then
        RELEASE_TAG_ARGS="--dryRun $RELEASE_TAG_ARGS"
      fi

      if [ "$RELEASE_TAG_HOTFIX" = "true" ]; then
        RELEASE_TAG_ARGS="--hotfix $RELEASE_TAG_ARGS"
      fi

      pnpm exec nx run @bsport/nx:release-tag $RELEASE_TAG_ARGS

Release:Build Artifact:
  stage: release-artifact
  needs:
    - job: Release:Tag
      artifacts: true
  extends:
    - .ci-runner-xlarge-highcpu # 16 vCPU, 16GB RAM
  before_script: !reference [.pnpm-setup, before_script]
  rules:
    - if: $CI_COMMIT_BRANCH == "dev" && $CI_PIPELINE_SOURCE == "push"
      when: on_success
    - if: $CI_COMMIT_BRANCH == "dev" && $CI_PIPELINE_SOURCE == "web"
      when: on_success
    - if: $CI_COMMIT_BRANCH =~ /^hotfix\/v[0-9]+\.[0-9]+\.x$/ && $CI_PIPELINE_SOURCE == "push"
      when: on_success
    - if: $CI_COMMIT_BRANCH =~ /^hotfix\/v[0-9]+\.[0-9]+\.x$/ && $CI_PIPELINE_SOURCE == "web"
      when: on_success
  script:
    - |
      if [ "${RELEASE_TAG_AVAILABLE:-false}" != "true" ]; then
        echo "No release tag was created for this pipeline; skipping release artifact build."
        exit 0
      fi
      if ! echo "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
        echo "Invalid release tag: $RELEASE_TAG"
        exit 1
      fi
    - echo "🔱 Building release artifact for $RELEASE_TAG"
    - ARTIFACT_VERSION="$RELEASE_TAG" bash tools/scripts/build-artifact.sh

Release:Linear Sync:
  image: node:24-bookworm-slim
  stage: release-tracking
  needs:
    - job: Release:Tag
      artifacts: true
    - job: Release:Build Artifact
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
    LINEAR_RELEASE_CLI_VERSION: "v0.12.0"
  rules:
    - if: $CI_COMMIT_BRANCH == "dev" && $CI_PIPELINE_SOURCE == "push" && $CI_LINEAR_ACCESS_KEY
      when: on_success
    - if: $CI_COMMIT_BRANCH == "dev" && $CI_PIPELINE_SOURCE == "web" && $CI_LINEAR_ACCESS_KEY
      when: on_success
    - if: $CI_COMMIT_BRANCH =~ /^hotfix\/v[0-9]+\.[0-9]+\.x$/ && $CI_PIPELINE_SOURCE == "push" && $CI_LINEAR_ACCESS_KEY
      when: on_success
    - if: $CI_COMMIT_BRANCH =~ /^hotfix\/v[0-9]+\.[0-9]+\.x$/ && $CI_PIPELINE_SOURCE == "web" && $CI_LINEAR_ACCESS_KEY
      when: on_success
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates curl git
    - rm -rf /var/lib/apt/lists/*
    - |
      if [ -z "$CI_JOB_TOKEN" ]; then
        echo "CI_JOB_TOKEN is not available; GitLab merge request metadata lookup may be incomplete."
      else
        echo "GitLab merge request metadata will be fetched through the REST API with the CI job token."
      fi
  script:
    - |
      if [ "${RELEASE_TAG_AVAILABLE:-false}" != "true" ]; then
        echo "No release tag was created for this pipeline; skipping Linear release sync."
        exit 0
      fi
      if ! echo "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
        echo "Invalid release tag: $RELEASE_TAG"
        exit 1
      fi
    - git fetch origin --tags --force
    - echo "🔱 Syncing Linear release for $RELEASE_TAG"
    - node tools/scripts/resolve-linear-release-issues.mts --tag "$RELEASE_TAG" --create-synthetic-refs --output linear-release-issues.env
    - . linear-release-issues.env
    - |
      if [ "${LINEAR_RELEASE_ISSUES_AVAILABLE:-false}" != "true" ]; then
        echo "No Linear issue id found in commit messages or source branches; skipping Linear release sync."
        exit 0
      fi
      if [ "${LINEAR_RELEASE_BASE_REF_AVAILABLE:-false}" != "true" ]; then
        echo "No previous semver release tag found for $RELEASE_TAG; skipping Linear release sync to avoid scanning unrelated history."
        exit 0
      fi
    - 'echo "Found Linear issues for release: $LINEAR_RELEASE_ISSUES"'
    - 'echo "Using Linear release base ref: $LINEAR_RELEASE_BASE_REF"'
    - 'echo "Created synthetic refs for linear-release: ${LINEAR_RELEASE_SYNTHETIC_REFS:-none}"'
    - |
      case "$(uname -m)" in
        x86_64|amd64)
          LINEAR_RELEASE_CLI_ARCH="x64"
          ;;
        aarch64|arm64)
          LINEAR_RELEASE_CLI_ARCH="arm64"
          ;;
        *)
          echo "Unsupported architecture for linear-release: $(uname -m)"
          exit 1
          ;;
      esac

      LINEAR_RELEASE_CLI_ASSET="linear-release-linux-${LINEAR_RELEASE_CLI_ARCH}"

      if ! curl --fail --show-error --silent --location --retry 3 --retry-delay 2 --retry-all-errors "https://github.com/linear/linear-release/releases/download/${LINEAR_RELEASE_CLI_VERSION}/${LINEAR_RELEASE_CLI_ASSET}" -o linear-release; then
        echo "Failed to download linear-release ${LINEAR_RELEASE_CLI_VERSION}."
        exit 1
      fi

      chmod +x linear-release

      if ! ./linear-release --help >/dev/null 2>&1; then
        echo "linear-release ${LINEAR_RELEASE_CLI_VERSION} (${LINEAR_RELEASE_CLI_ASSET}) failed to start."
        echo "The prebuilt linear-release binary requires a glibc-based Linux image; Alpine/musl images are not supported."
        exit 1
      fi

      LINEAR_ACCESS_KEY="$CI_LINEAR_ACCESS_KEY" ./linear-release sync --name="Ichizen ${RELEASE_TAG}" --release-version="${RELEASE_TAG}" --base-ref="$LINEAR_RELEASE_BASE_REF" --verbose --json
