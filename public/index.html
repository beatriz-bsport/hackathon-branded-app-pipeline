<!DOCTYPE html>
<html>
<head>
  <title>Embeddable Widget</title>
</head>
<body>
<div style="margin-left: 0px">
  <p>
    Here is the widget
  </p>
  <div id="bsport-widget"></div>
  <p style="background: red;">
    Here is some text below the widget
  </p>
  <script src="./widget.js"></script>
  <script>
    BsportWidget.mount({
      "parentElement": "bsport-widget",
      "companyId": 109,
      "dialogMode": 1,
      "widgetType": "loginButton",
      "showFab": true,
      "language": 'fr',
    })
  </script>
  <script src="./widget.js"></script>
  <script>
    BsportWidget.mount({
      "parentElement": "bsport-widget",
      "companyId": 109,
      "dialogMode": 1,
      "widgetType": "calendar",
      "showFab": true,
      "language": 'fr',
    })
  </script>
</div>
</body>
</html>
