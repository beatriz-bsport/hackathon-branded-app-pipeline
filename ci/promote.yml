.Promote Base:
  image: 672633452901.dkr.ecr.eu-west-3.amazonaws.com/bsport-infra/gitlab-build-docker:v1.0.1
  stage: promote
  tags:
    - light
    - cluster:bsport-tooling
  script:
    - git remote -v
    - git remote set-url origin https://${GIT_USERNAME}:${GIT_PASSWORD}@gitlab.com/bsport/bsport-saas.git
    - git config --global user.email "contact@bsport.io"
    - git config --global user.name "bsport-bot"
    - git fetch
    - git checkout $DEST_BRANCH
    - git merge --ff-only origin/${SOURCE_BRANCH}
    - git push origin $DEST_BRANCH

Promote to staging:
  extends: .Promote Base
  variables:
    SOURCE_BRANCH: dev
    DEST_BRANCH: master
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_REF_NAME == "dev"
      when: manual
    - when: never

Promote to production:
  extends: .Promote Base
  variables:
    SOURCE_BRANCH: master
    DEST_BRANCH: production
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_REF_NAME == "master"
      when: manual 
    - when: never
