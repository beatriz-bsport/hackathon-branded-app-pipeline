.Kaizen Docs Base:
  extends:
    - .ci-runner-xlarge-highcpu # 16 vCPU, 16GB RAM
  before_script:
    - npm install --global corepack@latest
    - corepack enable
    - corepack install
    - |
      EXPECTED_NODE_MAJOR=$(node -p "require('./package.json').engines.node.split('.')[0]")
      ACTUAL_NODE_VERSION=$(node --version)
      ACTUAL_NODE_MAJOR=$(node -p "process.versions.node.split('.')[0]")
      if [ "$ACTUAL_NODE_MAJOR" != "$EXPECTED_NODE_MAJOR" ]; then
        echo "Expected Node $EXPECTED_NODE_MAJOR.x, got $ACTUAL_NODE_VERSION"
        exit 1
      fi
    - pnpm --version
    - pnpm store path
    - echo "*"
    - echo "⏳ Install node modules and deps with pnpm..."
    - ICHIZEN_SKIP_POSTINSTALL=true pnpm install --frozen-lockfile --prefer-offline
    - echo "✅ Node modules have been installed successfully"

Check Kaizen Docs:
  stage: build
  extends:
    - .Kaizen Docs Base
  allow_failure: false
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      allow_failure: false
      when: on_success
  script:
    - echo "🔱 Checking Kaizen docs"
    - pnpm -C apps/docs install --frozen-lockfile --prefer-offline
    - pnpm -C apps/docs format:check
    - pnpm -C apps/docs typecheck
    - pnpm -C apps/docs lint
