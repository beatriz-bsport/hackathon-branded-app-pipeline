image: 672633452901.dkr.ecr.eu-west-3.amazonaws.com/bsport-infra/gitlab-build-frontend:14

variables:
  AWS_REGION: eu-west-3
  REGISTRY_ENDPOINT: 672633452901.dkr.ecr.eu-west-3.amazonaws.com
  REGISTRY_NAME: bsport/bsport-saas-builder
  # Hardcode env and branch variables only once at the top
  ENV_DEV: "dev"
  ENV_STAGING: "staging"
  ENV_PRODUCTION: "production"
  ENV_FEATURE_BRANCH: "feature-branch"
  BRANCH_DEV: "dev"
  BRANCH_STAGING: "staging"
  BRANCH_PRODUCTION: "main"
  BRANCH_FEATURE_BRANCH: "feature/*"

before_script:
  - chmod +x ./ci/setup-ci.sh
  - ./ci/setup-ci.sh

stages:
  - merge-request-open
  - lint
  - deploy

include:
  - local: "/ci/merge-request-open.yml"
  - local: "/ci/lint.yml"
  - local: "/ci/deploy-environment.yml"
