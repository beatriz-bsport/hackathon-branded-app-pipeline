Prepare Docker Builder Image:
  image: 672633452901.dkr.ecr.eu-west-3.amazonaws.com/bsport-infra/gitlab-build-docker:latest
  tags:
    - build-frontend
    - cluster:bsport-tooling
  stage: prepare-image-docker
  retry: 
    max: 2
  script:
    - sleep 10 # because the docker service needs to be up'd cf https://gitlab.com/gitlab-org/charts/gitlab/-/issues/478
    - aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${REGISTRY_ENDPOINT}
    - docker build --network host -t ${REGISTRY_ENDPOINT}/bsport/bsport-saas-builder:${CI_COMMIT_REF_NAME} .
    - docker push ${REGISTRY_ENDPOINT}/bsport/bsport-saas-builder:${CI_COMMIT_REF_NAME} --quiet
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    DOCKER_HOST: tcp://docker:2375
  services:
    - docker:24-dind

