image: 672633452901.dkr.ecr.eu-west-3.amazonaws.com/bsport-infra/gitlab-build-frontend:14

variables:
  AWS_REGION: eu-west-3
  REGISTRY_ENDPOINT: 672633452901.dkr.ecr.eu-west-3.amazonaws.com
  REGISTRY_NAME: bsport/bsport-saas-builder

stages:
  - prepare-builder
  - merge-request-open
  - lint
  - deploy-feature-branch
  - deploy

include:
  - local: "/ci/utilities.yml"
  - local: "/ci/prepare-builder.yml"
  - local: "/ci/merge-request-open.yml"
  - local: "/ci/lint.yml"
  - local: "/ci/deploy-feature-branch.yml"
  - local: "/ci/deploy-environment.yml"

workflow:
  rules:
    # Prevent that pushing on a MR creates dupplicate pipelines ("push" and "merge_request_event")
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    # Skip pipelines for draft merge requests
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE =~ /^(\[Draft\]|\(Draft\)|Draft:)/
      when: never
    # Default behaviour : fallback to Job rules
    - when: always
