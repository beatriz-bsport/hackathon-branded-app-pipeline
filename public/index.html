<!DOCTYPE html>
<html>
<head>
  <title>Embeddable Widget</title>
</head>
<body>
<div style="margin-left: 0px">
  <p>
    Here is the widget
  </p>
  <div id="bsport-widget-007"></div>
  <p style="background: red;">
    Here is some text below the widget
  </p>
  <script src="./widget.js"></script>
  <script>
    BsportWidget.mount({
      "parentElement": "bsport-widget-007",
      "companyId": 201,
      "dialogMode": 1,
      "widgetType": "loginButton",
      "language": 'fr',
    })
  </script>
  <div>
  <div style="height: 100px; width: 100px; background-color: red;"/>
    <p> Some random element in the website of the studio trying to break stuff</p>
  </div>
  <div>
  <div id="bsport-widget-lol"></div>
  </div>
  <script src="./widget.js"></script>
  <script>
    BsportWidget.mount({
      "parentElement": "bsport-widget-lol",
      "companyId": 01,
      "dialogMode": 1,
      "widgetType": "calendar",
      "showFab": true,
      "language": 'fr',
    })
  </script>
</div>
</body>
</html>
