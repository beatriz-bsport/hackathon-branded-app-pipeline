# Merge test-elisabeth-production to test-elisabeth-staging after test-elisabeth-production deployment
merge-test-elisabeth-production-to-test-elisabeth-staging:
  stage: post-deploy
  image: alpine/git:latest
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  before_script:
    # Configure git
    - git config --global user.email "ci@bsport.com"
    - git config --global user.name "GitLab CI"
    # Set up authentication using CI token
    - git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  script:
    - |
      echo "Starting merge from test-elisabeth-production to test-elisabeth-staging..."

      # Fetch all branches
      git fetch origin

      # Checkout test-elisabeth-staging branch
      git checkout test-elisabeth-staging
      git pull origin test-elisabeth-staging

      # Attempt to merge test-elisabeth-production into test-elisabeth-staging
      if git merge origin/test-elisabeth-production --no-commit --no-ff; then
        echo "✅ Merge successful - no conflicts detected"
        
        # Complete the merge
        git commit -m "chore: merge test-elisabeth-production into test-elisabeth-staging [skip ci]"
        
        # Push the changes
        git push origin test-elisabeth-staging
        
        echo "Successfully merged test-elisabeth-production into test-elisabeth-staging"
        
        # Optional: Send success notification to Slack
        # TODO: Update Slack webhook
        if [ -n "$SLACK_APP_DEV_WEBHOOK_URL" ]; then
          curl -X POST -H 'Content-type: application/json' \
            --data "{
              \"text\": \"✅ Successfully merged \`test-elisabeth-production\` into \`test-elisabeth-staging\` branch\",
              \"channel\": \"#deployments\",
              \"username\": \"GitLab CI\",
              \"icon_emoji\": \":gitlab:\"
            }" \
            "$SLACK_APP_DEV_WEBHOOK_URL"
        fi
        
      else
        echo "❌ Merge conflicts detected!"
        
        # Abort the merge
        git merge --abort
        
        # Send conflict notification to Slack
        if [ -n "$SLACK_APP_DEV_WEBHOOK_URL" ]; then
          curl -X POST -H 'Content-type: application/json' \
            --data "{
              \"text\": \"⚠️ **MERGE CONFLICTS DETECTED** ⚠️\n\nFailed to automatically merge \`test-elisabeth-production\` into \`test-elisabeth-staging\` branch.\n\n**Action Required:**\n• Manual intervention needed to resolve conflicts\n• Please merge \`test-elisabeth-production\` into \`test-elisabeth-staging\` manually\n• Project: ${CI_PROJECT_NAME}\n• Pipeline: ${CI_PIPELINE_URL}\",
              \"channel\": \"#deployments\",
              \"username\": \"GitLab CI\",
              \"icon_emoji\": \":warning:\"
            }" \
            "$SLACK_APP_DEV_WEBHOOK_URL"
        fi
        
        # Exit with error to mark job as failed
        exit 1
      fi
  rules:
    # Only run when pushing to test-elisabeth-production branch
    - if: $CI_COMMIT_BRANCH == "test-elisabeth-production" && $CI_PIPELINE_SOURCE == "push"
      when: on_success
  allow_failure: true # Don't fail the entire pipeline if merge conflicts occur
