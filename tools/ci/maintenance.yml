# Maintenance mode jobs.
#
# For ephemeral environments: jobs appear in MR pipelines and use
#   CI_MERGE_REQUEST_IID automatically — no extra variables needed.
#
# For persistent environments: trigger via GitLab UI "Run pipeline" and set:
#   MAINTENANCE_ENV : dev | staging | production
#
# CLOUDFRONT_INVALIDATION_TOKEN must be set as a masked CI/CD variable
# (not required for ephemeral — TTL=0, no invalidation needed).

.Maintenance Base:
  extends:
    - .ci-runner-small # 2 vCPU, 4GB RAM - maintenance mode jobs are not resource intensive
  stage: maintenance

.Maintenance Ephemeral Base:
  extends: .Maintenance Base
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
  variables:
    MAINTENANCE_ENV: "ephemeral"
  environment:
    name: "maintenance/preview-${CI_MERGE_REQUEST_IID}"
    url: "https://preview-${CI_MERGE_REQUEST_IID}.backoffice.chaos.bsport.io"

.Maintenance Persistent Base:
  extends: .Maintenance Base
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" # "Run pipeline" button only
      when: manual
      allow_failure: false
  variables:
    MAINTENANCE_ENV: "" # override at trigger time: dev | staging | production
  environment:
    name: "maintenance/$MAINTENANCE_ENV"

"Maintenance ON (ephemeral)":
  extends: .Maintenance Ephemeral Base
  script:
    - bash tools/scripts/maintenance-on.sh "$MAINTENANCE_ENV"

"Maintenance OFF (ephemeral)":
  extends: .Maintenance Ephemeral Base
  script:
    - bash tools/scripts/maintenance-off.sh "$MAINTENANCE_ENV"

"Maintenance ON":
  extends: .Maintenance Persistent Base
  script:
    - |
      if [ -z "$MAINTENANCE_ENV" ]; then
        echo "ERROR: MAINTENANCE_ENV variable is required (dev | staging | production)"
        exit 1
      fi
    - bash tools/scripts/maintenance-on.sh "$MAINTENANCE_ENV"

"Maintenance OFF":
  extends: .Maintenance Persistent Base
  script:
    - |
      if [ -z "$MAINTENANCE_ENV" ]; then
        echo "ERROR: MAINTENANCE_ENV variable is required (dev | staging | production)"
        exit 1
      fi
    - bash tools/scripts/maintenance-off.sh "$MAINTENANCE_ENV"
