<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>bsport — Maintenance</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background-color: #f7f9f9; /* luna-grey-100 */
        color: #2b3030; /* luna-grey-700 */
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .card {
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 2px 16px 0 rgba(61, 77, 71, 0.1);
        padding: 48px 40px;
        max-width: 520px;
        width: 100%;
        text-align: center;
      }

      /* Logo */
      .logo-wrap {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 32px;
      }
      .logo-mark {
        height: 44px;
        width: auto;
        flex-shrink: 0;
      }
      .logo-text {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.5px;
        color: #2b3030;
      }

      /* Content */
      h1 {
        font-size: 22px;
        font-weight: 700;
        line-height: 1.3;
        color: #2b3030;
        margin-bottom: 8px;
      }
      .subtitle {
        font-size: 15px;
        line-height: 1.6;
        color: #565e5d; /* luna-grey-600 */
        margin-bottom: 32px;
      }

      /* Status dot */
      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 32px;
        font-size: 13px;
        color: #565e5d;
        background: #f7f9f9;
        border: 1px solid #e5eaea;
        padding: 6px 14px;
        border-radius: 999px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #25948d; /* turquoise-500 */
        animation: pulse 2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }

      @media (max-width: 480px) {
        .card {
          padding: 32px 24px;
        }
        h1 {
          font-size: 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <!-- Logo -->
      <div class="logo-wrap">
        <!-- bsport brand mark — viewBox cropped to the two-column icon only -->
        <svg
          class="logo-mark"
          viewBox="55 5 170 223"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <defs>
            <linearGradient
              id="m-grad1"
              x1="49.16"
              y1="175.27"
              x2="147.42"
              y2="58.16"
              gradientUnits="userSpaceOnUse"
            >
              <stop offset="0" stop-color="#2d767f" />
              <stop offset="1" stop-color="#149d7b" />
            </linearGradient>
          </defs>
          <!-- Right column (white on dark bg → turquoise on light bg) -->
          <path
            fill="#32a69e"
            d="M155.18,99.41a8.17,8.17,0,0,0-9.39,8.07V216a8.17,8.17,0,0,0,9.39,8.06,63,63,0,0,0,0-124.61Z"
          />
          <!-- Left tall column (gradient) -->
          <path
            fill="url(#m-grad1)"
            d="M71.5,9.3a8.17,8.17,0,0,0-9.21,8.09V152.72a72,72,0,0,0,62.79,71.41,8.16,8.16,0,0,0,9.21-8.09V80.72A72,72,0,0,0,71.5,9.3Z"
          />
        </svg>
        <span class="logo-text">bsport</span>
      </div>

      <!-- English -->
      <h1>We'll be right back</h1>
      <p class="subtitle">
        bsport is currently undergoing scheduled maintenance.<br />
        We apologise for the inconvenience and will be back shortly.
      </p>

      <div class="status">
        <span class="dot"></span>
        Maintenance in progress
      </div>
    </div>
  </body>
</html>
