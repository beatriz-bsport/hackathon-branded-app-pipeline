<!DOCTYPE html>
<html>
<head>
  <title>Embeddable Widget</title>
</head>
<body>
<div style="margin-left: 0px">
  <p>
    Here is the widget
  </p>
  <div id="bsport-widget"></div>
  <p style="background: red;">
    Here is some text below the widget
  </p>
  <script src="./widget.js"></script>
  <script>
    BsportWidget.mount({
      "parentElement": "bsport-widget",
      "companyId": 89,
      "dialogMode": 1,
      "widgetType": "pass",
      "showFab": false,
      "language": 'fr',
      "config": {
        "pass": {
          "hidePaymentPack": false,
          "hidePrivatePass": false,
          "hidePaymentCombo": false
        }
      }
    })
  </script>
</div>
</body>
</html>
